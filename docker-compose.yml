version: '3.8'

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n_open_source
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_METRICS=true
      - N8N_LOG_LEVEL=info
    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./database:/data

  dashboard:
    build: ./dashboard
    container_name: dashboard_open_source
    restart: always
    ports:
      - "8501:8501"
    volumes:
      - ./database:/app/database
    depends_on:
      - n8n
